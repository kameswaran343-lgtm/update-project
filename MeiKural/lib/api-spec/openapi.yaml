openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Local literary-corpus quote verification and evaluation API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: corpus
    description: Read-only access to locally available Tamil literary corpora
  - name: verification
    description: Deterministic matching against selected local literary corpora
  - name: evaluation
    description: Deterministic evaluation results
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check API health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kural/{id}:
    get:
      operationId: getKural
      tags: [corpus]
      summary: Get a couplet from the local corpus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1330
      responses:
        "200":
          description: The requested couplet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kural"
        "404":
          description: Kural not found
  /literature/catalog:
    get:
      operationId: getLiteratureCatalog
      tags: [corpus]
      summary: List literary corpora available for verification
      responses:
        "200":
          description: Installed and unavailable literary corpus sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiteratureWork"
  /literature/verify:
    post:
      operationId: verifyLiteraryQuote
      tags: [verification]
      summary: Search a selected or all available Tamil literary corpora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiteratureVerifyInput"
      responses:
        "200":
          description: Best exact or near match across selected corpora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteratureVerification"
        "409":
          description: The requested corpus is not installed
        "422":
          description: Invalid work selection or claimed Kural number
  /verify:
    post:
      operationId: verifyQuote
      tags: [verification]
      summary: Match a quote against the local corpus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
  /guard:
    post:
      operationId: guardAnswer
      tags: [verification]
      summary: Extract and verify quotations in a pasted answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardInput"
      responses:
        "200":
          description: Annotated answer and verification summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardResult"
  /eval/results:
    get:
      operationId: getEvaluationResults
      tags: [evaluation]
      summary: Get the latest deterministic evaluation report
      responses:
        "200":
          description: Evaluation metrics and threshold sweep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResults"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Kural:
      type: object
      properties:
        id:
          type: integer
        paal:
          type: string
        chapter_no:
          type: integer
        chapter_name:
          type: string
        line1:
          type: string
        line2:
          type: string
        meaning_en:
          type: ["string", "null"]
        needs_human_review:
          type: boolean
      required: [id, paal, chapter_no, chapter_name, line1, line2, meaning_en, needs_human_review]
    LiteratureWork:
      type: object
      properties:
        id:
          type: string
          enum: [thirukkural, purananuru, tolkappiyam, aathichudi]
        name:
          type: string
        available:
          type: boolean
        entry_count:
          type: integer
        source_file:
          type: string
      required: [id, name, available, entry_count, source_file]
    LiteratureVerifyInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        work_id:
          type: string
          enum: [all, thirukkural, purananuru, tolkappiyam, aathichudi]
          default: all
        claimed_id:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1330
      required: [text]
    LiteratureVerification:
      type: object
      properties:
        verdict:
          type: string
          enum: [verified, near_match, not_found]
        matched_id:
          type: ["integer", "null"]
        score:
          type: number
        matched_scope:
          type: ["string", "null"]
          enum: [full, line1, line2, null]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/DiffPart"
        claimed_id_ok:
          type: ["boolean", "null"]
        warning:
          type: ["string", "null"]
        work_id:
          type: ["string", "null"]
          enum: [thirukkural, purananuru, tolkappiyam, aathichudi, null]
        work_name:
          type: ["string", "null"]
        matched_record:
          type: ["object", "null"]
          additionalProperties: true
        searched_work_ids:
          type: ["array", "null"]
          items:
            type: string
            enum: [thirukkural, purananuru, tolkappiyam, aathichudi]
      required:
        - verdict
        - matched_id
        - score
        - matched_scope
        - diff
        - claimed_id_ok
        - warning
        - work_id
        - work_name
        - matched_record
    DiffPart:
      type: object
      properties:
        kind:
          type: string
          enum: [same, changed, input_only, corpus_only]
        input:
          type: string
        corpus:
          type: string
      required: [kind, input, corpus]
    Verification:
      type: object
      properties:
        verdict:
          type: string
          enum: [verified, near_match, not_found]
        matched_id:
          type: ["integer", "null"]
        score:
          type: number
        matched_scope:
          type: ["string", "null"]
          enum: [full, line1, line2, null]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/DiffPart"
        claimed_id_ok:
          type: ["boolean", "null"]
        warning:
          type: ["string", "null"]
        matched_kural:
          anyOf:
            - $ref: "#/components/schemas/Kural"
            - type: "null"
      required: [verdict, matched_id, score, matched_scope, diff, claimed_id_ok, warning, matched_kural]
    VerifyInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        claimed_id:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1330
      required: [text]
    GuardInput:
      type: object
      properties:
        llm_answer:
          type: string
          minLength: 1
          maxLength: 20000
      required: [llm_answer]
    GuardQuote:
      type: object
      properties:
        text:
          type: string
        verdict:
          type: string
          enum: [verified, near_match, not_found]
        matched_id:
          type: ["integer", "null"]
        score:
          type: number
        matched_scope:
          type: ["string", "null"]
        diff:
          type: array
          items:
            $ref: "#/components/schemas/DiffPart"
        claimed_id_ok:
          type: ["boolean", "null"]
        warning:
          type: ["string", "null"]
        matched_kural:
          anyOf:
            - $ref: "#/components/schemas/Kural"
            - type: "null"
      required: [text, verdict, matched_id, score, matched_scope, diff, claimed_id_ok, warning, matched_kural]
    GuardSummary:
      type: object
      properties:
        verified:
          type: integer
        near:
          type: integer
        not_found:
          type: integer
      required: [verified, near, not_found]
    GuardResult:
      type: object
      properties:
        annotated_answer:
          type: string
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/GuardQuote"
        summary:
          $ref: "#/components/schemas/GuardSummary"
      required: [annotated_answer, quotes, summary]
    EvaluationMetrics:
      type: object
      properties:
        false_accept_rate:
          type: number
        real_recall:
          type: number
        verified_precision:
          type: number
        tricky_near_match_rate:
          type: number
        fake_abstain_rate:
          type: number
        sample_counts:
          type: object
          additionalProperties:
            type: integer
      required:
        - false_accept_rate
        - real_recall
        - verified_precision
        - tricky_near_match_rate
        - fake_abstain_rate
        - sample_counts
    ThresholdPoint:
      type: object
      properties:
        threshold:
          type: integer
        false_accept_rate:
          type: number
        real_recall:
          type: number
        tricky_near_match_rate:
          type: number
        fake_abstain_rate:
          type: number
      required: [threshold, false_accept_rate, real_recall, tricky_near_match_rate, fake_abstain_rate]
    EvaluationResults:
      type: object
      properties:
        generated_at:
          type: string
        near_threshold:
          type: integer
        metrics:
          $ref: "#/components/schemas/EvaluationMetrics"
        threshold_sweep:
          type: array
          items:
            $ref: "#/components/schemas/ThresholdPoint"
        verdict_counts:
          type: object
          additionalProperties:
            type: integer
        dataset_counts:
          type: object
          additionalProperties:
            type: integer
      required: [generated_at, near_threshold, metrics, threshold_sweep, verdict_counts, dataset_counts]
